<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyber Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00ffe0;
      margin: 0;
    }
    .login-box {
      background: rgba(0, 0, 0, 0.7);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px #0ff;
      width: 350px;
      text-align: center;
      position: relative;
    }
    .login-box h2 {
      margin-bottom: 20px;
      color: #0ff;
    }
    .login-box input {
      width: 85%;
      padding: 12px;
      margin: 10px 0;
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-eye {
      position: absolute;
      right: 35px;
      top: 10px;
      cursor: pointer;
      color: #0ff;
      font-size: 18px;
    }
    .login-box button {
      background: #00ffe0;
      color: #000;
      padding: 12px 30px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 0 20px #0ff;
    }
    .login-box button:hover {
      background: #0ff;
      box-shadow: 0 0 40px #0ff;
    }
    .extra-links {
      font-size: 14px;
      margin-top: 15px;
    }
    .extra-links a {
      color: #00ffe0;
      text-decoration: none;
    }
    .success-message {
      color: #00FF00;
      font-size: 16px;
      margin-top: 20px;
    }
    #accessBtn {
      display: none;
      background: #00ffe0;
      color: #000;
      padding: 12px 30px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 0 20px #0ff;
    }
    #accessBtn:hover {
      background: #0ff;
      box-shadow: 0 0 40px #0ff;
    }
  </style>
</head>

<body onload="checkLoginAndSpeak()">
  <div class="login-box">
    <h2>Cyber Login</h2>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <input type="text" name="username" placeholder="👤 Username" required />
      <div class="password-wrapper">
        <input type="password" name="password" id="loginPassword" placeholder="🔒 Password" required />
        <span class="toggle-eye" onclick="togglePassword('loginPassword')">👁</span>
      </div>
      <button type="submit">🔑 Login</button>
    </form>

    <div class="extra-links">
      <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <div class="success-message" id="successMessage" style="display: none;">
      Login Successful! Redirecting to home ...
    </div>

    <button type="button" id="accessBtn" onclick="redirectToIndex()">🔓 Access</button>
  </div>

  <script>
    function speakAI() {
      const msg = new SpeechSynthesisUtterance("Welcome to Cyber Login. Please enter your credentials.");
      msg.pitch = 1.2;
      msg.rate = 1;
      msg.volume = 1;
      msg.lang = 'en-US';
      window.speechSynthesis.speak(msg);
    }

    function checkLoginAndSpeak() {
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      const alreadySpoken = sessionStorage.getItem("spoken");

      if (isLoggedIn !== "true" && !alreadySpoken) {
        speakAI();
        sessionStorage.setItem("spoken", "true");
      }
    }

    function togglePassword(id) {
      const field = document.getElementById(id);
      field.type = field.type === "password" ? "text" : "password";
    }

    function handleLogin(event) {
      event.preventDefault();

      const username = document.querySelector('input[name="username"]').value.trim();
      const password = document.querySelector('input[name="password"]').value;

      const storedUsername = localStorage.getItem("username");
      const storedPassword = localStorage.getItem("password");

      if (username === storedUsername && password === storedPassword) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("username", username);

        const successMessage = document.getElementById('successMessage');
        const accessBtn = document.getElementById('accessBtn');

        successMessage.style.display = 'block';
        accessBtn.style.display = 'block';

        setTimeout(() => {
          window.location.href = "index.html";
        }, 3000);
      } else {
        alert("❌ Invalid username or password. Please try again.");
      }
    }

    function redirectToIndex() {
       window.location.href = "index.html";
    }
  </script>
</body>
</html>
