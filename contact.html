<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact & Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #090920;
      color: #fff;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #00ffe0;
    }
    form {
      max-width: 600px;
      margin: 30px auto;
      background: #151531;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ffe0;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
      background: #1f1f3d;
      color: #fff;
    }
    .btn {
      background: #00ffe0;
      color: #000;
      padding: 12px 25px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffe0;
    }
    .btn:hover {
      background: #00ccbb;
    }
    .success-message {
      color: #00e6cc;
      text-align: center;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .success-message.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>📬 Feedback & Support</h1>
  <form id="feedbackForm">
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" required />

    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" required />

    <label for="type">Type of Inquiry</label>
    <select name="type" id="type" required>
      <option value="Feedback">Feedback</option>
      <option value="Report Issue">Report Issue</option>
      <option value="Suggest Feature">Suggest Feature</option>
      <option value="Other">Other</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <label for="rating">Rate Your Experience (1-5)</label>
    <select id="rating" name="rating" required>
      <option value="5">5 - Excellent</option>
      <option value="4">4 - Good</option>
      <option value="3">3 - Average</option>
      <option value="2">2 - Poor</option>
      <option value="1">1 - Bad</option>
    </select>

    <button type="submit" class="btn">Submit</button>
  </form>

  <p class="success-message" id="successMessage">✅ Message sent successfully to the admin!</p>

<script>
  document.getElementById('feedbackForm').addEventListener('submit', function(e) {
    e.preventDefault(); // prevent actual form submission
    this.style.display = 'none'; // hide the form
    document.getElementById('successMessage').classList.add('show');
  });
</script>

</body>
</html>
